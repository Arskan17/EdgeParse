[package]
name = "ocr_wasm"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tiff", "gif"] }
ocrs = "0.13.1"
rten = "0.26"
rten-imageproc = "0.26"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
