[project]
name = "raphael-edgep"
version = "0.3.0"
description = "PDF-to-structured-data extraction via the edgeparse WASM engine — supports PDF input and OCR for PNG, JPG, WebP, BMP, TIFF, GIF. It can also be used as a SKILL, or deployed as an MCP server."
readme = "README.md"
requires-python = ">=3.11, <=3.14"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=1.28.1",
    "wasmtime>=46.0.1",
]

[dependency-groups]
dev = [
    "pillow>=12.3.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
